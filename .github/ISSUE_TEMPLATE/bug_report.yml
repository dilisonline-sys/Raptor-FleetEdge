name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Remove API keys, balances and account IDs** from anything you paste below.
        Security vulnerabilities should be reported privately — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the fleet with ...
        2. Switch agent fleetedge2 to ...
        3. See ...
  - type: dropdown
    id: mode
    attributes:
      label: Trading mode
      options:
        - demo
        - testnet
        - live
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: How are you running it?
      options:
        - Docker Compose
        - Plain Python
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Output of `git rev-parse --short HEAD`
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From /tmp/rfe_<name>.log in the container (secrets removed)
      render: shell
